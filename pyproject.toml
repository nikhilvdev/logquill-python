[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logquill"
version = "0.1.3"
description = "A structured, leveled logging framework with pluggable transports and a plugin pipeline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Nikhil Arora" }]
keywords = [
    "logging",
    "structured-logging",
    "logger",
    "observability",
    "json-logging",
    "async-logging",
    "transports",
    "plugins",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
http = ["aiohttp>=3.9"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]
hooks = [
    # Separate from "dev": pre-commit dropped Python 3.8 support, but our
    # CI matrix still tests 3.8, and pre-commit is only needed locally.
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/nikhilvdev/logquill-python"
Repository = "https://github.com/nikhilvdev/logquill-python"
Changelog = "https://github.com/nikhilvdev/logquill-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/nikhilvdev/logquill-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["logquill"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["logquill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["logquill"]
